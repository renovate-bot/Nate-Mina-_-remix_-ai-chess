version: '3.8'

services:
  chess-arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remix-chess-arena
    image: natestechtips/remix-chess-arena:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
